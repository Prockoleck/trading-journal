<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Trading Journal{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body { background: #0f0f1a; color: #e0e0e0; }
    .navbar { border-bottom: 1px solid #2a2a3e; }
    .card { background: #1a1a2e; border: 1px solid #2a2a3e; border-radius: 12px; }
    .card-header { background: #16162a; border-bottom: 1px solid #2a2a3e; }
    .stat-card { background: linear-gradient(135deg, #1a1a3e, #1a1a2e); border: 1px solid #2a2a3e; border-radius: 12px; padding: 1.25rem; }
    .stat-value { font-size: 1.8rem; font-weight: 700; }
    .stat-label { font-size: .8rem; color: #8888aa; text-transform: uppercase; letter-spacing: 1px; }
    .profit { color: #34d399; }
    .loss { color: #f87171; }
    .btn-primary { background: #6366f1; border: none; }
    .btn-primary:hover { background: #4f46e5; }
    .btn-outline-light { border-color: #3a3a5e; color: #c0c0d0; }
    .btn-outline-light:hover { background: #2a2a4e; border-color: #5a5a7e; }
    .table { color: #e0e0e0; }
    .table > :not(caption) > * > * { border-bottom-color: #2a2a3e; }
    .table-hover tbody tr:hover { background: #22223a; }
    .form-control, .form-select { background: #16162a; border: 1px solid #2a2a3e; color: #e0e0e0; }
    .form-control:focus, .form-select:focus { background: #1a1a2e; border-color: #6366f1; box-shadow: 0 0 0 2px rgba(99,102,241,.2); color: #e0e0e0; }
    a { color: #818cf8; }
    a:hover { color: #a5b4fc; }
    .badge-buy { background: #065f46; color: #6ee7b7; }
    .badge-sell { background: #7f1d1d; color: #fca5a5; }
    .pagination .page-link { background: #1a1a2e; border-color: #2a2a3e; color: #c0c0d0; }
    .pagination .page-item.active .page-link { background: #6366f1; border-color: #6366f1; }
    .flash { margin-top: .5rem; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #0f0f1a; }
    ::-webkit-scrollbar-thumb { background: #2a2a3e; border-radius: 4px; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid px-3">
      <a class="navbar-brand fw-bold" href="/"><i class="bi bi-journal-bookmark-fill me-2"></i>Trading Journal</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="/"><i class="bi bi-grid-fill"></i> Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="/trades"><i class="bi bi-list-ul"></i> Trades</a></li>
          <li class="nav-item"><a class="nav-link" href="/trades/add"><i class="bi bi-plus-circle"></i> New Trade</a></li>
          <li class="nav-item"><a class="nav-link" href="/settings"><i class="bi bi-gear"></i> Settings</a></li>
        </ul>
        <a class="btn btn-outline-light btn-sm" href="/logout"><i class="bi bi-box-arrow-right"></i> Logout</a>
      </div>
    </div>
  </nav>

  <div class="container-fluid px-3 py-3">
    {% with msgs = get_flashed_messages() %}
      {% if msgs %}
        {% for msg in msgs %}
          <div class="alert alert-info alert-dismissible fade show flash">{{ msg }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
